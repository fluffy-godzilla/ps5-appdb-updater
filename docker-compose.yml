services:
  ps5-appdb-updater:
    image: ghcr.io/fluffy-godzilla/ps5-appdb-updater:latest
    container_name: ps5-appdb-updater
    ports:
      - 5000:5000
    environment:
      - PS5_SERVER=192.168.10.100
      - APPDB_SCRIPT_PATH=/scripts/appdb.sql
      - INFODB_SCRIPT_PATH=/scripts/infodb.sql
    volumes:
      - ./examples:/scripts:ro